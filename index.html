<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Поиск по займу</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
      padding: 40px;
      width: 100%;
      max-width: 680px;
      height: fit-content;
    }

    h1 {
      font-size: 22px;
      color: #1a1a2e;
      margin-bottom: 28px;
    }

    .search-row {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cdd3da;
      border-radius: 8px;
      font-size: 15px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #4f7ef7;
    }

    input[type="text"]::placeholder {
      color: #aaa;
    }

    button {
      padding: 10px 24px;
      background: #4f7ef7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    button:hover {
      background: #3563d8;
    }

    .btn-csv {
      margin-top: 16px;
      background: #fff;
      color: #4f7ef7;
      border: 1.5px solid #4f7ef7;
      font-size: 14px;
      padding: 8px 18px;
    }

    .btn-csv:hover {
      background: #f0f4ff;
    }

    .result-area {
      min-height: 60px;
    }

    .error-msg {
      color: #d94f4f;
      font-size: 14px;
      margin-bottom: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    thead tr {
      background: #f5f7ff;
    }

    th {
      text-align: left;
      padding: 12px 16px;
      color: #555;
      font-weight: 600;
      border-bottom: 2px solid #e4e8f0;
    }

    td {
      padding: 14px 16px;
      color: #222;
      border-bottom: 1px solid #eef0f5;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .hidden {
      display: none;
    }

    .label-number {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge-active {
      background: #e6f9f0;
      color: #1a9e5c;
    }

    .badge-closed {
      background: #f2f2f2;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Поиск клиента по займу</h1>

    <div class="search-row">
      <input
        type="text"
        id="loanInput"
        placeholder="Введите номера займов, напр. Z-001, Z-002"
      />
      <button onclick="search()">Найти</button>
    </div>

    <div class="result-area">
      <div class="error-msg hidden" id="errorMsg">Заём не найден.</div>

      <table class="hidden" id="resultTable">
        <thead>
          <tr>
            <th>Имя клиента</th>
            <th>Дата рождения</th>
            <th>Номер телефона</th>
            <th>Статус займа</th>
          </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>

      <div class="hidden" id="csvRow">
        <button class="btn-csv" onclick="downloadCSV()">Скачать CSV</button>
      </div>
    </div>
  </div>

  <script>
    const loans = {
      "Z-001": { name: "Иванов Алексей Петрович",    dob: "12.03.1985", phone: "+7 (900) 123-45-67", status: "active"  },
      "Z-002": { name: "Смирнова Ольга Викторовна",  dob: "07.11.1990", phone: "+7 (911) 234-56-78", status: "closed"  },
      "Z-003": { name: "Козлов Дмитрий Сергеевич",   dob: "25.06.1978", phone: "+7 (922) 345-67-89", status: "active"  },
      "Z-004": { name: "Новикова Мария Андреевна",   dob: "19.02.1995", phone: "+7 (933) 456-78-90", status: "active"  },
      "Z-005": { name: "Попов Игорь Николаевич",     dob: "30.09.1982", phone: "+7 (944) 567-89-01", status: "closed"  },
    };

    function search() {
      const input = document.getElementById("loanInput").value;
      const table = document.getElementById("resultTable");
      const body  = document.getElementById("resultBody");
      const error = document.getElementById("errorMsg");

      table.classList.add("hidden");
      error.classList.add("hidden");
      document.getElementById("csvRow").classList.add("hidden");
      body.innerHTML = "";

      const ids = input.split(",").map(s => s.trim().toUpperCase()).filter(Boolean);
      if (!ids.length) return;

      const notFound = [];

      ids.forEach(id => {
        const record = loans[id];
        if (!record) {
          notFound.push(id);
          return;
        }
        const statusLabel = record.status === "active" ? "Активен" : "Закрыт";
        const statusClass = record.status === "active" ? "badge-active" : "badge-closed";

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${record.name}</td>
          <td>${record.dob}</td>
          <td>${record.phone}</td>
          <td><span class="badge ${statusClass}">${statusLabel}</span></td>
        `;
        body.appendChild(row);
      });

      if (body.children.length) {
        table.classList.remove("hidden");
        document.getElementById("csvRow").classList.remove("hidden");
      }

      if (notFound.length) {
        error.textContent = `Не найдено: ${notFound.join(", ")}`;
        error.classList.remove("hidden");
      }
    }

    function downloadCSV() {
      const headers = ["Имя клиента", "Дата рождения", "Номер телефона", "Статус займа"];
      const rows = Array.from(document.querySelectorAll("#resultBody tr")).map(tr =>
        Array.from(tr.querySelectorAll("td")).map(td => `"${td.innerText.trim()}"`)
      );

      const csv = [headers.join(";"), ...rows.map(r => r.join(";"))].join("\n");
      const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "loan.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("loanInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") search();
    });
  </script>
</body>
</html>
